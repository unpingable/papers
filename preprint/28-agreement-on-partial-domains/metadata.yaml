abstract: |
  Systems with partial observations often compare two states by requiring equal
  answers only to queries available in both. This common-domain relation is
  reflexive and symmetric but can fail transitivity, preventing a canonical
  quotient and permitting incomparable maximal coarsenings. We formalize two
  repairs in Lean. Treating query availability as part of future behavior yields
  an equivalence relation and a canonical quotient characterized by observation-
  kernel refinement. If availability is intentionally ignored, we characterize
  the domain families that restore transitivity uniformly over arbitrary
  proposition-valued decision profiles: precisely the Δ-systems, whose distinct
  domains share one common root and otherwise have private petals. A mediator-
  hole labeling proves sharpness; explicit fixtures show that equal domains are
  unnecessary, nested domains and nonempty overlap are insufficient, and fixed
  labelings may be transitive accidentally outside the Δ-system regime. The
  contribution is a machine-checked synthesis and design boundary built from
  classical ingredients, not a claim that partial-function compatibility or
  Δ-systems are new.
